# netlify.toml
# TrunkRoom 프론트엔드 배포 설정 (Netlify)
#
# Production branch: main
# ⚠️  Express API 서버 (/api/*) 는 별도 서버에 배포 후
#     VITE_AI_BASE_URL 환경변수를 그 URL로 교체해야 AI 기능이 동작함

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── SPA 라우팅 ───────────────────────────────────────────────────────────────
# 모든 경로를 index.html 로 fallback — 새로고침 404 방지
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
